[package]
name = "explorer-app"
version = "0.1.0"
description = "Windows-only GPUI Explorer application composition root."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "SuperExplorer"
path = "src/main.rs"

[[bin]]
name = "superexplorer-mft-helper"
path = "src/bin/mft_helper.rs"

[[bin]]
name = "superexplorer-mft-service"
path = "src/bin/mft_service.rs"

[features]
# Deliberately non-default: enables only the isolated extension-state seam
# used by the Windows headful Safe Mode gate.
uitest-support = ["explorer-extension-host/integration-test-support"]

[dependencies]
abi_stable.workspace = true
anyhow.workspace = true
explorer-common = { path = "../explorer-common" }
explorer-extension-broker = { path = "../explorer-extension-broker" }
explorer-extension-api = { path = "../explorer-extension-api" }
explorer-extension-host = { path = "../explorer-extension-host" }
explorer-extension-ui-api = { path = "../explorer-extension-ui-api" }
explorer-automation = { path = "../explorer-automation" }
explorer-automation-win = { path = "../explorer-automation-win" }
explorer-jobs = { path = "../explorer-jobs" }
explorer-model = { path = "../explorer-model" }
explorer-remote = { path = "../explorer-remote" }
explorer-search = { path = "../explorer-search" }
explorer-shell-win = { path = "../explorer-shell-win" }
explorer-ui = { path = "../explorer-ui" }
gpui.workspace = true
gpui_windows.workspace = true
image.workspace = true
raw-window-handle.workspace = true
rusqlite = { workspace = true, features = ["hooks", "limits"] }
serde.workspace = true
serde_json.workspace = true
rpassword.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
tokei.workspace = true
tempfile.workspace = true

[dev-dependencies]
explorer-extension-host = { path = "../explorer-extension-host", features = ["integration-test-support"] }
explorer-test-support = { path = "../explorer-test-support" }
tempfile.workspace = true

[build-dependencies]
embed-resource.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[lints]
workspace = true
