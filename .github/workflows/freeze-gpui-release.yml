name: freeze-gpui-release

on:
  workflow_dispatch:
    inputs:
      release_tag: { required: true, type: string }
      rc_id: { required: true, type: string }

permissions:
  contents: write

jobs:
  freeze:
    # This environment is the trust boundary for all signer identities and evidence bytes.
    environment: sdk-release-freeze
    runs-on: [self-hosted, windows, x64, hyperv-offline]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - name: Capture protected branch baseline
        shell: powershell
        run: "'RELEASE_BASE_SHA=' + (git rev-parse HEAD) | Add-Content -LiteralPath $env:GITHUB_ENV"
      - name: Materialize protected release evidence
        shell: powershell
        env:
          GPG_KEYRING_B64: ${{ secrets.GPG_KEYRING_B64 }}
          DETACHED_SIGNATURE_B64: ${{ secrets.DETACHED_SIGNATURE_B64 }}
          PROTECTION_RECORD_B64: ${{ secrets.PROTECTION_RECORD_B64 }}
          PROVENANCE_B64: ${{ secrets.PROVENANCE_B64 }}
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'release-evidence'; New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          foreach ($item in @(@('GPG_KEYRING_B64','release-keyring.gpg'), @('DETACHED_SIGNATURE_B64','bundle.sig'), @('PROTECTION_RECORD_B64','protection.json'), @('PROVENANCE_B64','provenance.json'))) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($item[0]))) { throw "missing protected secret $($item[0])" }
            [IO.File]::WriteAllBytes((Join-Path $evidence $item[1]), [Convert]::FromBase64String([Environment]::GetEnvironmentVariable($item[0])))
          }
          $gpgHome = Join-Path $evidence 'gnupg'; New-Item -ItemType Directory -Path $gpgHome -Force | Out-Null
          & gpg.exe --homedir $gpgHome --batch --import (Join-Path $evidence 'release-keyring.gpg')
          if ($LASTEXITCODE -ne 0) { throw 'unable to import the protected release public-key export' }
      - name: Rebuild and load SDK fixtures in an isolated guest
        shell: powershell
        run: |
          $attestation = Join-Path $env:RUNNER_TEMP 'release-offline-attestation.json'
          & sdk/ci/Invoke-OfflineSdkGuest.template.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -AttestationPath $attestation
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $attestation)) { throw 'release offline guest gate failed' }
          $proof = Get-Content -LiteralPath $attestation -Raw | ConvertFrom-Json
          if ($proof.schema_version -ne 2 -or $proof.load.mode -ne 'compatible' -or $proof.load.exit_code -ne 0) { throw 'release offline guest attestation is invalid' }
      - name: freeze-release-under-protected-policy
        shell: powershell
        env:
          SUPEREXPLORER_RELEASE_PROTECTION_RECORD_SHA256: ${{ secrets.RELEASE_PROTECTION_RECORD_SHA256 }}
          SUPEREXPLORER_RELEASE_SIGNER: ${{ secrets.RELEASE_SIGNER }}
          SUPEREXPLORER_RELEASE_GPG_PRIMARY_FINGERPRINT: ${{ secrets.RELEASE_GPG_PRIMARY_FINGERPRINT }}
          SUPEREXPLORER_RELEASE_GPG_KEYRING_SHA256: ${{ secrets.RELEASE_GPG_KEYRING_SHA256 }}
          SUPEREXPLORER_RELEASE_BUILDER: ${{ secrets.RELEASE_BUILDER }}
          SUPEREXPLORER_RELEASE_PREDICATE_TYPE: ${{ secrets.RELEASE_PREDICATE_TYPE }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RC_ID: ${{ inputs.rc_id }}
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'release-evidence'
          if ($env:RELEASE_TAG -notmatch '^gpui-sdk-v[0-9A-Za-z._-]+$' -or $env:RC_ID -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$') { throw 'invalid release workflow input' }
          & sdk/scripts/freeze-release.ps1 -ReleaseTag $env:RELEASE_TAG -RcId $env:RC_ID -ProtectionProvider github-environment -ProtectionPolicyId sdk-release-freeze-v1 -ProtectionRecord (Join-Path $evidence 'protection.json') -DetachedSignature (Join-Path $evidence 'bundle.sig') -Signer $env:SUPEREXPLORER_RELEASE_SIGNER -GpgKeyring (Join-Path $evidence 'release-keyring.gpg') -GpgHome (Join-Path $evidence 'gnupg') -GpgPrimaryFingerprint $env:SUPEREXPLORER_RELEASE_GPG_PRIMARY_FINGERPRINT -Provenance (Join-Path $evidence 'provenance.json') -Builder $env:SUPEREXPLORER_RELEASE_BUILDER -PredicateType $env:SUPEREXPLORER_RELEASE_PREDICATE_TYPE
      - name: Commit immutable freeze record
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RC_ID: ${{ inputs.rc_id }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^gpui-sdk-v[0-9A-Za-z._-]+$') { throw 'invalid release workflow input' }
          if ((git status --porcelain -- sdk/snapshot/release-freeze.json sdk/snapshot/release-ledger.json sdk/releases/$env:RC_ID) -eq '') { throw 'freeze produced no immutable records' }
          $unexpected = @(git status --porcelain | Where-Object { $_ -notmatch " (sdk/snapshot/(release-freeze|release-ledger)\.json|sdk/releases/$([regex]::Escape($env:RC_ID))/)" })
          if ($unexpected.Count -ne 0) { throw "freeze modified unexpected paths: $unexpected" }
          git config user.name 'superexplorer-release-bot'; git config user.email 'release-bot@users.noreply.github.com'
          git add sdk/snapshot/release-freeze.json sdk/snapshot/release-ledger.json "sdk/releases/$env:RC_ID"
          git commit -m "freeze GPUI SDK $env:RELEASE_TAG"
          git push origin "HEAD:refs/heads/$env:GITHUB_REF_NAME" "--force-with-lease=refs/heads/$env:GITHUB_REF_NAME:$env:RELEASE_BASE_SHA"
