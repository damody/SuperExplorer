name: promote-gpui-snapshot

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Run ID that produced gpui-snapshot-candidate-<run-id>"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gpui-snapshot-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    environment:
      name: gpui-snapshot-promotion
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gpui-snapshot-candidate-${{ inputs.candidate_run_id }}
          path: ${{ runner.temp }}/gpui-snapshot-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify protected proof and compare-and-swap promote
        shell: powershell
        env:
          SUPEREXPLORER_GPUI_APPROVAL_HMAC_KEY: ${{ secrets.GPUI_SNAPSHOT_APPROVAL_HMAC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace([string]$env:SUPEREXPLORER_GPUI_APPROVAL_HMAC_KEY)) { throw 'protected GPUI approval HMAC key is unavailable' }
          & powershell.exe -NoProfile -File sdk\scripts\promote-gpui-snapshot.ps1 -CandidateDirectory "$env:RUNNER_TEMP\gpui-snapshot-candidate" -Branch "$env:GITHUB_REF_NAME" -Push
          if ($LASTEXITCODE -ne 0) { throw "GPUI snapshot promotion failed ($LASTEXITCODE)" }
