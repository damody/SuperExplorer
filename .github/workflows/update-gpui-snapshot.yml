name: update-gpui-snapshot
on: workflow_dispatch
permissions: { contents: read }
jobs:
  candidate:
    runs-on: [self-hosted, windows, x64]
    environment: gpui-snapshot-approval
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: powershell
        env:
          SUPEREXPLORER_GPUI_UPDATE_APPROVAL: ${{ secrets.SUPEREXPLORER_GPUI_UPDATE_APPROVAL }}
          SUPEREXPLORER_GPUI_UPDATE_RUN_ID: ${{ github.run_id }}
        run: |
          $env:SUPEREXPLORER_GPUI_UPDATE_NONCE = [guid]::NewGuid().ToString('N')
          & sdk/scripts/update-gpui-snapshot.ps1
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with: { name: gpui-snapshot-candidate, path: ${{ runner.temp }}/superexplorer-gpui-update/candidate-attestation.json }
