name: update-gpui-snapshot

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for requesting a GPUI snapshot update"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gpui-snapshot-update
  cancel-in-progress: false

jobs:
  # This job has no approval environment and produces the immutable input to
  # the protected gate.  It deliberately does not write a snapshot or publish.
  resolve:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Resolve immutable candidate plan
        shell: powershell
        env:
          SUPEREXPLORER_GPUI_UPDATE_RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = (Resolve-Path '.').Path
          $gpui = Join-Path $repo 'vendor\gpui-ce'
          $approvedPath = Join-Path $repo 'sdk\snapshot\approved-gpui.json'
          $approved = Get-Content -LiteralPath $approvedPath -Raw | ConvertFrom-Json
          $old = [string]$approved.source.revision
          if ($old -notmatch '^[0-9a-f]{40}$') { throw 'approved snapshot revision is not a full commit' }
          $origin = (git -C $gpui remote get-url origin).Trim()
          if ($origin -ne 'https://github.com/damody/gpui-ce-explorer.git') { throw 'unauthorized GPUI origin' }
          $shallow = (git -C $gpui rev-parse --is-shallow-repository).Trim()
          if ($shallow -eq 'true') { git -C $gpui fetch --no-tags --unshallow origin main --quiet }
          elseif ($shallow -eq 'false') { git -C $gpui fetch --no-tags origin main --quiet }
          else { throw 'could not determine GPUI repository history depth' }
          if ($LASTEXITCODE -ne 0) { throw 'unable to resolve authorized GPUI main' }
          if ((git -C $gpui rev-parse --is-shallow-repository).Trim() -ne 'false') { throw 'GPUI repository history is incomplete' }
          $new = (git -C $gpui rev-parse 'origin/main').Trim()
          $tree = (git -C $gpui rev-parse "$new`^{tree}").Trim()
          $parent = (git -C $gpui rev-list -1 "$new^" ).Trim()
          $fastForward = ((git -C $gpui merge-base $old $new).Trim() -eq $old)
          if ($new -eq $old) { throw 'remote main has no new snapshot candidate' }
          $nonce = [guid]::NewGuid().ToString('N')
          $run = [string]$env:SUPEREXPLORER_GPUI_UPDATE_RUN_ID
          $plan = "$old`n$new`n$tree`n$run`n$nonce"
          $sha = [Security.Cryptography.SHA256]::Create()
          try { $digest = ([BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($plan)))).Replace('-', '').ToLowerInvariant() }
          finally { $sha.Dispose() }
          $output = Join-Path $env:RUNNER_TEMP 'superexplorer-gpui-update-resolve'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $candidate = [ordered]@{
            schema_version = 1
            baseline_revision = $old
            old_revision = $old
            new_revision = $new
            new_tree = $tree
            parent_revision = $parent
            fast_forward = $fastForward
            repository = $origin
            resolved_ref = 'refs/remotes/origin/main'
            workflow_run_id = $run
            nonce = $nonce
            candidate_plan_digest = $digest
          }
          $json = $candidate | ConvertTo-Json -Depth 8
          $planPath = Join-Path $output 'candidate-plan.json'
          [IO.File]::WriteAllText($planPath, $json, [Text.UTF8Encoding]::new($false))
          (Get-FileHash -LiteralPath $planPath -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content -NoNewline -LiteralPath (Join-Path $output 'candidate-plan.json.sha256')

      - name: Upload immutable resolve artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: gpui-snapshot-resolve-${{ github.run_id }}
          path: ${{ runner.temp }}/superexplorer-gpui-update-resolve
          if-no-files-found: error
          retention-days: 14

  # Environment protection is intentionally attached only after resolve has
  # produced an immutable plan.  This job contains no publication/CAS step.
  gate:
    needs: resolve
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 180
    environment:
      name: gpui-snapshot-approval
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Download immutable resolve artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gpui-snapshot-resolve-${{ github.run_id }}
          path: ${{ runner.temp }}/superexplorer-gpui-update-resolve

      - name: Require complete GPUI history for candidate transaction
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $gpui = Join-Path (Resolve-Path '.').Path 'vendor\gpui-ce'
          $shallow = (git -C $gpui rev-parse --is-shallow-repository).Trim()
          if ($shallow -eq 'true') { git -C $gpui fetch --no-tags --unshallow origin main --quiet }
          elseif ($shallow -eq 'false') { git -C $gpui fetch --no-tags origin main --quiet }
          else { throw 'could not determine GPUI repository history depth' }
          if ($LASTEXITCODE -ne 0 -or (git -C $gpui rev-parse --is-shallow-repository).Trim() -ne 'false') { throw 'GPUI repository history is incomplete' }

      - name: Verify plan and run approved candidate build
        shell: powershell
        env:
          SUPEREXPLORER_GPUI_UPDATE_RUN_ID: ${{ github.run_id }}
          SUPEREXPLORER_GPUI_UPDATE_REASON: ${{ inputs.reason }}
          SUPEREXPLORER_GPUI_APPROVAL_HMAC_KEY: ${{ secrets.GPUI_SNAPSHOT_APPROVAL_HMAC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = (Resolve-Path '.').Path
          $resolve = Join-Path $env:RUNNER_TEMP 'superexplorer-gpui-update-resolve'
          $planPath = Join-Path $resolve 'candidate-plan.json'
          $hashPath = Join-Path $resolve 'candidate-plan.json.sha256'
          if ((Get-FileHash -LiteralPath $planPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne (Get-Content -LiteralPath $hashPath -Raw).Trim().ToLowerInvariant()) { throw 'resolve artifact digest mismatch' }
          $plan = Get-Content -LiteralPath $planPath -Raw | ConvertFrom-Json
          foreach ($name in @('baseline_revision','old_revision','new_revision','new_tree','workflow_run_id','nonce','candidate_plan_digest')) { if ([string]::IsNullOrWhiteSpace([string]$plan.$name)) { throw "resolve plan missing $name" } }
          if ($plan.schema_version -ne 1 -or $plan.workflow_run_id -ne [string]$env:SUPEREXPLORER_GPUI_UPDATE_RUN_ID) { throw 'resolve plan identity mismatch' }
          if ($plan.old_revision -ne $plan.baseline_revision -or $plan.new_revision -notmatch '^[0-9a-f]{40}$' -or $plan.new_tree -notmatch '^[0-9a-f]{40}$' -or $plan.candidate_plan_digest -notmatch '^[0-9a-f]{64}$') { throw 'resolve plan format invalid' }
          $planInput = "$($plan.old_revision)`n$($plan.new_revision)`n$($plan.new_tree)`n$($plan.workflow_run_id)`n$($plan.nonce)"
          $sha = [Security.Cryptography.SHA256]::Create()
          try { $recomputedPlanDigest = ([BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($planInput)))).Replace('-', '').ToLowerInvariant() }
          finally { $sha.Dispose() }
          if ($recomputedPlanDigest -ne $plan.candidate_plan_digest) { throw 'resolve plan identity digest mismatch' }
          $approval = [ordered]@{
            schema_version = 1
            baseline_revision = [string]$plan.baseline_revision
            old_revision = [string]$plan.old_revision
            new_revision = [string]$plan.new_revision
            new_tree = [string]$plan.new_tree
            candidate_plan_digest = [string]$plan.candidate_plan_digest
            workflow_run_id = [string]$plan.workflow_run_id
            nonce = [string]$plan.nonce
            reason = [string]$env:SUPEREXPLORER_GPUI_UPDATE_REASON
            approver = 'protected-environment:gpui-snapshot-approval'
            issued_utc = [DateTime]::UtcNow.ToString('o')
            expires_utc = [DateTime]::UtcNow.AddHours(2).ToString('o')
          }
          $runDir = Join-Path $env:RUNNER_TEMP 'superexplorer-gpui-update'
          New-Item -ItemType Directory -Force -Path $runDir | Out-Null
          $approvalPath = Join-Path $runDir 'approval.json'
          [IO.File]::WriteAllText($approvalPath, ($approval | ConvertTo-Json -Depth 8), [Text.UTF8Encoding]::new($false))
          $env:SUPEREXPLORER_GPUI_UPDATE_NONCE = [string]$plan.nonce
          $env:SUPEREXPLORER_GPUI_UPDATE_APPROVAL = Get-Content -LiteralPath $approvalPath -Raw
          & powershell.exe -NoProfile -File (Join-Path $repo 'sdk\scripts\update-gpui-snapshot.ps1')
          if ($LASTEXITCODE -ne 0) { throw "candidate snapshot build failed ($LASTEXITCODE)" }
          $candidateDir = Join-Path $runDir 'candidate-output'
          New-Item -ItemType Directory -Force -Path $candidateDir | Out-Null
          Copy-Item -LiteralPath $approvalPath -Destination (Join-Path $candidateDir 'approval.json') -Force
          Copy-Item -LiteralPath (Join-Path $runDir 'candidate-attestation.json') -Destination (Join-Path $candidateDir 'candidate-attestation.json') -Force
          foreach ($file in @('sdk\snapshot\approved-gpui.json','sdk\sdk-lock.json','sdk\bundle-manifest.json','sdk\ui-abi-fingerprint.json')) { Copy-Item -LiteralPath (Join-Path $repo $file) -Destination $candidateDir -Force }
          (git -C (Join-Path $repo 'vendor\gpui-ce') rev-parse HEAD).Trim() | Set-Content -NoNewline -LiteralPath (Join-Path $candidateDir 'gpui-revision.txt')
          $patchPath = Join-Path $candidateDir 'candidate.patch'
          git -C $repo diff --binary "--output=$patchPath" -- .
          if ([string]::IsNullOrWhiteSpace([string]$env:SUPEREXPLORER_GPUI_APPROVAL_HMAC_KEY)) { throw 'protected GPUI approval HMAC key is unavailable' }
          $promotionFiles = @('approval.json','candidate-attestation.json','approved-gpui.json','sdk-lock.json','bundle-manifest.json','ui-abi-fingerprint.json','gpui-revision.txt','candidate.patch')
          $promotionManifest = [ordered]@{ schema_version = 1; repository_baseline_commit = (git -C $repo rev-parse HEAD).Trim(); files = @($promotionFiles | ForEach-Object { [ordered]@{ name = $_; sha256 = (Get-FileHash -LiteralPath (Join-Path $candidateDir $_) -Algorithm SHA256).Hash.ToLowerInvariant() } }) }
          $promotionManifestPath = Join-Path $candidateDir 'promotion-manifest.json'
          [IO.File]::WriteAllText($promotionManifestPath, ($promotionManifest | ConvertTo-Json -Depth 8), [Text.UTF8Encoding]::new($false))
          $promotionPayload = "$($approval.baseline_revision)`n$($approval.new_revision)`n$($approval.new_tree)`n$($approval.candidate_plan_digest)`n$($approval.workflow_run_id)`n$($approval.nonce)`n$($promotionManifest.repository_baseline_commit)`n$((Get-FileHash -LiteralPath $promotionManifestPath -Algorithm SHA256).Hash.ToLowerInvariant())"
          $hmac = [Security.Cryptography.HMACSHA256]::new([Text.Encoding]::UTF8.GetBytes([string]$env:SUPEREXPLORER_GPUI_APPROVAL_HMAC_KEY))
          try { $proof = [ordered]@{ schema_version = 1; hmac_sha256 = ([BitConverter]::ToString($hmac.ComputeHash([Text.Encoding]::UTF8.GetBytes($promotionPayload)))).Replace('-', '').ToLowerInvariant() } }
          finally { $hmac.Dispose() }
          [IO.File]::WriteAllText((Join-Path $candidateDir 'promotion-proof.json'), ($proof | ConvertTo-Json -Depth 4), [Text.UTF8Encoding]::new($false))
          'Candidate outputs only; publication requires a separate protected compare-and-swap promotion.' | Set-Content -LiteralPath (Join-Path $candidateDir 'PROMOTION-REQUIRED.txt')

      - name: Upload complete candidate outputs
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: gpui-snapshot-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/superexplorer-gpui-update/candidate-output
          if-no-files-found: error
          retention-days: 30
