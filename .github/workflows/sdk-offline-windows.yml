name: sdk-offline-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    environment: sdk-offline-release
    runs-on: [self-hosted, windows, x64, hyperv-offline]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run Hyper-V offline guest gate
        shell: powershell
        run: '& C:\ProgramData\SuperExplorerCI\Invoke-OfflineSdkGuest.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE" -AttestationPath "$env:RUNNER_TEMP\offline-attestation.json"'
      - name: Fail closed on repository-owned offline attestation
        shell: powershell
        run: |
          $attestation = Get-Content "$env:RUNNER_TEMP\offline-attestation.json" -Raw | ConvertFrom-Json
          $expected = (Get-FileHash "$env:GITHUB_WORKSPACE\sdk\bundle-manifest.json" -Algorithm SHA256).Hash.ToLower()
          $manifest = Get-Content "$env:GITHUB_WORKSPACE\sdk\bundle-manifest.json" -Raw | ConvertFrom-Json
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'offline-artifacts'
          if ($attestation.schema_version -ne 2 -or $attestation.producer -ne 'sdk/tests/offline-guest-gate.ps1' -or $attestation.guest_run_nonce -notmatch '^[0-9a-f]{32}$' -or $attestation.bundle_sha256 -ne $expected -or $attestation.copied_inventory_root_sha256 -ne $manifest.inventory_root_sha256 -or
              $attestation.network.before_nics -ne 0 -or $attestation.network.after_nics -ne 0 -or
              @($attestation.network.routes).Count -ne 0 -or $attestation.egress_attempts.direct -ne 'blocked' -or
              $attestation.egress_attempts.child -ne 'blocked') { throw 'Offline attestation validation failed.' }
          if (-not $attestation.cargo.home_initially_empty -or $attestation.cargo.home_entry_count_after_build -lt 0 -or
              -not $attestation.cargo.target_directories_distinct -or $attestation.cargo.host_command -notmatch '--locked --offline' -or
              $attestation.cargo.plugin_command -notmatch '--locked --offline' -or $attestation.load.mode -ne 'compatible' -or
              $attestation.load.exit_code -ne 0) { throw 'Offline cargo/load evidence validation failed.' }
          foreach ($hash in @($attestation.artifacts.host.sha256, $attestation.artifacts.plugin.sha256)) {
            if ([string]$hash -notmatch '^[0-9a-f]{64}$') { throw 'Offline artifact hash validation failed.' }
          }
          foreach ($artifact in @(@('abi-root-fixture-host.exe', $attestation.artifacts.host.sha256), @('abi_root_fixture_plugin.dll', $attestation.artifacts.plugin.sha256))) {
            $path = Join-Path $artifactRoot $artifact[0]
            if (-not (Test-Path -LiteralPath $path) -or (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $artifact[1]) { throw "Offline copied artifact binding failed: $($artifact[0])" }
          }
      - name: plugin-root-unit
        shell: powershell
        run: cargo test --manifest-path sdk/tools/plugin-tooling/Cargo.toml --locked --offline
      - name: plugin-load-compatible
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File sdk/tests/offline-host-plugin-contract.ps1
      - name: ui-fingerprint-mismatch-rejected
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File sdk/tests/ui-abi-fingerprint-contract.ps1
      - name: plugin-tooling-wrapper-contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File sdk/tests/plugin-tooling-self-test.ps1
      - name: clean-readme-reproduction
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File sdk/tests/plugin-tooling-self-test.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-offline-attestation
          path: |
            ${{ runner.temp }}\offline-attestation.json
            ${{ runner.temp }}\offline-artifacts
