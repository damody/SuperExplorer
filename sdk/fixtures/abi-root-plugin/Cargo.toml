[package]
name = "abi-root-fixture-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
name = "abi_root_fixture_plugin"
crate-type = ["cdylib"]

[features]
default = []
layout-mismatch = ["abi-root-fixture-contract/layout-mismatch"]

[dependencies]
abi_stable = { version = "=0.11.3", default-features = false }
abi-root-fixture-contract = { path = "../abi-contract" }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"

[workspace]
