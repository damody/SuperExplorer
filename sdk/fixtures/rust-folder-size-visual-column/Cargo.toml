[package]
name = "rust-folder-size-visual-column"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Both dependencies are consumed from the sealed SDK source directory while
# Cargo is offline. `explorer-extension-api` is the public author surface; it
# owns the ABI-safe factory trampoline and never exposes a handwritten callback
# contract to extension authors.
abi_stable = { version = "=0.11.3", default-features = false }
explorer-extension-api = "=1.2.0"
explorer-extension-ui-api = { path = "../../../crates/explorer-extension-ui-api" }
exif-lite = "=0.1.0"

[patch.crates-io]
exif-lite = { path = "vendor/private/exif-lite-0.1.0" }
explorer-extension-api = { path = "../../../crates/explorer-extension-api" }

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1

[workspace]
