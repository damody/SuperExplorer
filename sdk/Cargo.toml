[package]
name = "superexplorer-sdk-bootstrap"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[features]
default = []

[dependencies]
abi_stable = { version = "=0.11.3", default-features = false }
gpui = { path = "../vendor/gpui-ce/crates/gpui", version = "=0.2.2", default-features = false }

[workspace]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
